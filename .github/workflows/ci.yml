name: CI - Backend

on:
  push:
    branches:
      - master
      - "chore/ci-initial"
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # faz checkout do código
      - name: Checkout repository
        uses: actions/checkout@v3

      # configura Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      # instala dependências
      - name: Install dependencies
        run: npm install

      # Lint (opcional)
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true # não quebra CI se lint falhar

      # Run tests
      - name: Run tests
        env:
          NODE_ENV: test
        run: npm test